name: Publish signed ReiseDeutsch APK

on:
  push:
    branches: [release-apk]
    paths: [distribution/latest.json]

permissions:
  contents: write

concurrency:
  group: publish-reisedeutsch-v8
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release artifact and metadata
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          feed = json.loads(pathlib.Path('distribution/latest.json').read_text())
          apk = pathlib.Path('distribution/ReiseDeutsch-0.1.8.apk').read_bytes()
          assert feed['sourceCommit'] == '9f7900db84dbe825527562311a15bd7a74dab39c'
          assert feed['packageName'] == 'com.masakasakasama.reisedeutsch'
          assert feed['versionCode'] == 8 and feed['versionName'] == '0.1.8'
          assert feed['sha256'] == hashlib.sha256(apk).hexdigest() == 'e633cdd804dbf4bbe1ef90b14d9cda6bae12369bad5624075879c0370c80b267'
          assert feed['sizeBytes'] == len(apk) == 4497961
          assert feed['apkUrl'] == 'https://github.com/masakasakasama/German-language/releases/download/v8/ReiseDeutsch-0.1.8.apk'
          print('Verified signed APK bytes and update metadata')
          PY
      - name: Upload APK and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          if ! gh release view v8 >/dev/null 2>&1; then
            gh release create v8 --draft --target 9f7900db84dbe825527562311a15bd7a74dab39c --title 'ReiseDeutsch 0.1.8' --notes '画像全体の傾きを廃止。接続した2Dメッシュで胸の呼吸、頭と耳の追従、肩・肘・手首の手振りを実装。全画面のうさぎに適用。足踏みと、沈み込み・跳躍・着地のジャンプを追加。 テスト・lint・ビルド・署名を確認。実機確認は未実施です。'
          fi
          gh release upload v8 distribution/ReiseDeutsch-0.1.8.apk distribution/latest.json --clobber
          gh release edit v8 --draft=false
          gh release view v8 --json url,assets
