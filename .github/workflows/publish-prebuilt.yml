name: Publish signed ReiseDeutsch APK

on:
  push:
    branches: [release-apk]
    paths: [distribution/latest.json]

permissions:
  contents: write

concurrency:
  group: publish-reisedeutsch-v3
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release artifact and metadata
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          feed = json.loads(pathlib.Path('distribution/latest.json').read_text())
          apk = pathlib.Path('distribution/ReiseDeutsch-0.1.3.apk').read_bytes()
          assert feed['sourceCommit'] == 'bf5c6eea415fd661d31f528dd9d8cfde6aadd269'
          assert feed['packageName'] == 'com.masakasakasama.reisedeutsch'
          assert feed['versionCode'] == 3 and feed['versionName'] == '0.1.3'
          assert feed['sha256'] == hashlib.sha256(apk).hexdigest() == '334407d19528913707d6a0410f7a199f0e01eda9e8865fc44e4ee9cfb7d9f782'
          assert feed['sizeBytes'] == len(apk) == 1303892
          assert feed['apkUrl'] == 'https://github.com/masakasakasama/German-language/releases/download/v3/ReiseDeutsch-0.1.3.apk'
          print('Verified signed APK bytes and update metadata')
          PY
      - name: Upload APK and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          if ! gh release view v3 >/dev/null 2>&1; then
            gh release create v3 --draft --target bf5c6eea415fd661d31f528dd9d8cfde6aadd269 --title 'ReiseDeutsch 0.1.3' --notes '基礎コース14課に28の図解を追加。主語・動詞・対格・与格などを色分けし、役割を選んで強調できます。例文28個も意味ごとの箱に分解。語順や冠詞の変化を上下の図で比較できます。 単体テスト9件・lint・releaseビルド・旧版との署名一致を検証済み。実機表示は未確認です。'
          fi
          gh release upload v3 distribution/ReiseDeutsch-0.1.3.apk distribution/latest.json --clobber
          gh release edit v3 --draft=false
          gh release view v3 --json url,assets
