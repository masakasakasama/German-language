name: Publish signed ReiseDeutsch APK

on:
  push:
    branches: [release-apk]
    paths: [distribution/latest.json]

permissions:
  contents: write

concurrency:
  group: publish-reisedeutsch-v7
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release artifact and metadata
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          feed = json.loads(pathlib.Path('distribution/latest.json').read_text())
          apk = pathlib.Path('distribution/ReiseDeutsch-0.1.7.apk').read_bytes()
          assert feed['sourceCommit'] == 'b6cbc6868a5070f56dbb236ddf2250f7a5315ac7'
          assert feed['packageName'] == 'com.masakasakasama.reisedeutsch'
          assert feed['versionCode'] == 7 and feed['versionName'] == '0.1.7'
          assert feed['sha256'] == hashlib.sha256(apk).hexdigest() == '3c7ae40aa7cc94698650cb1400f51e5e0fd31c6480d680324ac73a7cc8dca429'
          assert feed['sizeBytes'] == len(apk) == 4514345
          assert feed['apkUrl'] == 'https://github.com/masakasakasama/German-language/releases/download/v7/ReiseDeutsch-0.1.7.apk'
          print('Verified signed APK bytes and update metadata')
          PY
      - name: Upload APK and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          if ! gh release view v7 >/dev/null 2>&1; then
            gh release create v7 --draft --target b6cbc6868a5070f56dbb236ddf2250f7a5315ac7 --title 'ReiseDeutsch 0.1.7' --notes 'すべてのうさぎを採用画像に統一。コース・会話・完了画面・地図・アプリアイコンも変更。端末の自動アニメーションがOFFでも再生ボタンで動かせます。待機とタップの動きを見やすくしました。 テスト・lint・ビルド・署名を確認。実機確認は未実施です。'
          fi
          gh release upload v7 distribution/ReiseDeutsch-0.1.7.apk distribution/latest.json --clobber
          gh release edit v7 --draft=false
          gh release view v7 --json url,assets
