name: Publish signed ReiseDeutsch APK

on:
  push:
    branches: [release-apk]
    paths: [distribution/latest.json]

permissions:
  contents: write

concurrency:
  group: publish-reisedeutsch-v5
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release artifact and metadata
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          feed = json.loads(pathlib.Path('distribution/latest.json').read_text())
          apk = pathlib.Path('distribution/ReiseDeutsch-0.1.5.apk').read_bytes()
          assert feed['sourceCommit'] == '797252cd87fcca7cbb6f23a59d4e449b57fb4a92'
          assert feed['packageName'] == 'com.masakasakasama.reisedeutsch'
          assert feed['versionCode'] == 5 and feed['versionName'] == '0.1.5'
          assert feed['sha256'] == hashlib.sha256(apk).hexdigest() == '8116a6d6d1640975db5b70e43473587f3a32d27164a0349428666107303c90f1'
          assert feed['sizeBytes'] == len(apk) == 1716899
          assert feed['apkUrl'] == 'https://github.com/masakasakasama/German-language/releases/download/v5/ReiseDeutsch-0.1.5.apk'
          print('Verified signed APK bytes and update metadata')
          PY
      - name: Upload APK and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          if ! gh release view v5 >/dev/null 2>&1; then
            gh release create v5 --draft --target 797252cd87fcca7cbb6f23a59d4e449b57fb4a92 --title 'ReiseDeutsch 0.1.5' --notes '旅のうさぎを3D化。ホームでゆっくり揺れ、ボタンで手を振ります。動きの停止とバックグラウンド描画停止に対応。編集可能なBlender・GLBモデルも公開。 テスト・lint・署名検証・オフスクリーン3D描画を確認済み。Android実機動作は未検証です。'
          fi
          gh release upload v5 distribution/ReiseDeutsch-0.1.5.apk distribution/latest.json art/mascot/reise-bunny-data.zip art/mascot/reise-bunny.glb --clobber
          gh release edit v5 --draft=false
          gh release view v5 --json url,assets
