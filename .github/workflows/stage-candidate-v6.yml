name: Stage v6 unsigned build in draft release
on:
  push:
    branches: [release-apk]
    paths: [.github/workflows/stage-candidate-v6.yml]
permissions:
  contents: write
  actions: read
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-v6-ae3711f0da355ba434f7402c4c63dcccd48c28a6
          run-id: 38725228789
          github-token: ${{ github.token }}
          path: candidate
      - name: Stage verified source candidate in draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(cat candidate/source-commit.txt)" = ae3711f0da355ba434f7402c4c63dcccd48c28a6
          test "$(gh release view v6 --json isDraft --jq .isDraft)" = true
          cd candidate
          zip -qr ../ReiseDeutsch-v6-unsigned-build.zip .
          cd ..
          gh release upload v6 ReiseDeutsch-v6-unsigned-build.zip
