name: Android
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Check source, tests, lint and debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Validate version and signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.REISE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.REISE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.REISE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.REISE_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/reise-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/reise-signing/reise.jks"
          test -s "$RUNNER_TEMP/reise-signing/reise.jks"
          printf 'REISE_KEYSTORE_PATH=%s\nREISE_KEY_ALIAS=%s\n' "$RUNNER_TEMP/reise-signing/reise.jks" "$KEY_ALIAS" >> "$GITHUB_ENV"
          printf 'REISE_KEYSTORE_PASSWORD=%s\nREISE_KEY_PASSWORD=%s\nBUILD_NUMBER=%s\nBUILD_SHA=%s\n' "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$BUILD_NUMBER" "$BUILD_SHA" >> "$GITHUB_ENV"
      - name: Test and build signed APK
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease --no-daemon
      - name: Verify signature and publish metadata
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -eu
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner verify --verbose "$apk"
          mkdir -p release
          name="ReiseDeutsch-0.1.${BUILD_NUMBER}.apk"
          cp "$apk" "release/$name"
          python3 - <<'PY'
          import hashlib, json, os
          n=os.environ['BUILD_NUMBER']; sha=os.environ['BUILD_SHA']; apk=f"ReiseDeutsch-0.1.{n}.apk"
          tag=f"v{n}"
          apk_path=f"release/{apk}"
          with open(apk_path,"rb") as stream: data=stream.read()
          feed={"schemaVersion":1,"packageName":"com.masakasakasama.reisedeutsch","versionCode":int(n),"versionName":f"0.1.{n}","minSdk":26,"sourceCommit":sha,"releasePageUrl":f"https://github.com/masakasakasama/German-language/releases/tag/{tag}","apkUrl":f"https://github.com/masakasakasama/German-language/releases/download/{tag}/{apk}","sha256":hashlib.sha256(data).hexdigest(),"sizeBytes":len(data),"notes":"GitHub Actionsでビルド・署名・検証したAndroid版ReiseDeutsch。"}
          with open('release/latest.json','w',encoding='utf-8') as f: json.dump(feed,f,ensure_ascii=False,indent=2)
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ReiseDeutsch 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/ReiseDeutsch-0.1.${{ github.run_number }}.apk
            release/latest.json
