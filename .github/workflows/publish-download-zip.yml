name: Publish ZIP download for Android
on:
  push:
    branches: [release-apk]
    paths: [distribution/ReiseDeutsch-0.1.3.zip]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify ZIP contains the published signed APK
        run: |
          python3 - <<'PY'
          import hashlib, zipfile
          with zipfile.ZipFile('distribution/ReiseDeutsch-0.1.3.zip') as z:
              assert z.testzip() is None
              assert z.namelist() == ['ReiseDeutsch-0.1.3.apk']
              apk = z.read('ReiseDeutsch-0.1.3.apk')
              assert len(apk) == 1303892
              assert hashlib.sha256(apk).hexdigest() == '334407d19528913707d6a0410f7a199f0e01eda9e8865fc44e4ee9cfb7d9f782'
          print('ZIP contains the exact published APK')
          PY
      - name: Add ZIP download to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v3 distribution/ReiseDeutsch-0.1.3.zip
