name: Publish ZIP download for Android
on:
  push:
    branches: [release-apk]
    paths: [distribution/ReiseDeutsch-0.1.4.zip]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify ZIP contains the published signed APK
        run: |
          python3 - <<'PY'
          import hashlib, zipfile
          with zipfile.ZipFile('distribution/ReiseDeutsch-0.1.4.zip') as z:
              assert z.testzip() is None
              assert z.namelist() == ['ReiseDeutsch-0.1.4.apk']
              apk = z.read('ReiseDeutsch-0.1.4.apk')
              assert len(apk) == 1320316
              assert hashlib.sha256(apk).hexdigest() == 'f0ccf1ec69c644c0a0374ec683652ee7d90b3cf981cff1e27ba167dc23a846c9'
          print('ZIP contains the exact published APK')
          PY
      - name: Add ZIP download to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v4 distribution/ReiseDeutsch-0.1.4.zip
