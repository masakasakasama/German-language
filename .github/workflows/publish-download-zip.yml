name: Publish ZIP download for Android
on:
  push:
    branches: [release-apk]
    paths: [distribution/ReiseDeutsch-0.1.7.zip]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify ZIP contains the published signed APK
        run: |
          python3 - <<'PY'
          import hashlib, zipfile
          with zipfile.ZipFile('distribution/ReiseDeutsch-0.1.7.zip') as z:
              assert z.testzip() is None
              assert z.namelist() == ['ReiseDeutsch-0.1.7.apk']
              apk = z.read('ReiseDeutsch-0.1.7.apk')
              assert len(apk) == 4514345
              assert hashlib.sha256(apk).hexdigest() == '3c7ae40aa7cc94698650cb1400f51e5e0fd31c6480d680324ac73a7cc8dca429'
          print('ZIP contains the exact published APK')
          PY
      - name: Add ZIP download to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v7 distribution/ReiseDeutsch-0.1.7.zip
